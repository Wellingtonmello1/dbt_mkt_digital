version: 2

# 🔹 SOURCES (tabelas do BigQuery)
sources:
  - name: raw
    description: "Dados brutos vindos do BigQuery"
    database: faculdade-435200
    schema: dbt_test
    tables:
      - name: leads
        description: "Tabela de leads capturados nas campanhas de marketing"
        columns:
          - name: lead_id
            description: "ID único do lead"
          - name: status
            description: "Status do lead no funil (New, Qualified, etc)"

# 🔹 MODELS (tabelas criadas pelo dbt)
models:

  - name: leads_clean_base
    description: "Camada staging - dados brutos de leads"
    columns:
      - name: lead_id
        description: "ID do lead"
        tests:
          - not_null
          - unique

      - name: status
        description: "Status do lead"

  - name: firt_analysis
    description: "Camada analítica - leads qualificados filtrados"
    columns:
      - name: lead_id
        description: "ID do lead"